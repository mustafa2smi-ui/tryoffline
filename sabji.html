<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gao Sabji Mandi</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-storage-compat.js"></script>
</head>
<body class="bg-slate-100 text-gray-800">

    <!-- Header -->
    <header class="bg-green-600 text-white p-4 shadow-lg text-center font-bold text-xl">
        🥦 Gao Ki Apni Sabji Mandi
    </header>

    <div class="max-w-md mx-auto p-4">
        
        <!-- Tab Navigation -->
        <div class="flex justify-between mb-4 bg-white rounded-lg p-1 shadow">
            <button onclick="switchTab('customer')" class="flex-1 py-2 font-semibold text-green-700 rounded-lg bg-green-50">Sabji Kharedein</button>
            <button onclick="switchTab('vendor')" class="flex-1 py-2 font-semibold text-gray-600 rounded-lg">Sabji Wala Login</button>
        </div>

        <!-- 1. CUSTOMER VIEW -->
        <div id="customerTab" class="block space-y-4">
            <h2 class="font-bold text-lg text-slate-700">Aaj Ka Taaza Rate</h2>
            <div id="productList" class="space-y-3">
                <p class="text-sm text-gray-500">Sabji loading ho rahi hai...</p>
            </div>
        </div>

        <!-- 2. VENDOR PANEL (Add/Update Rate) -->
        <div id="vendorTab" class="hidden space-y-4">
            
            <!-- Auth Form -->
            <div id="authBox" class="bg-white p-4 rounded-xl shadow space-y-3">
                <h3 class="font-bold">Dukandar Login</h3>
                <input type="email" id="loginEmail" placeholder="Email" class="w-full border p-2 rounded">
                <input type="password" id="loginPass" placeholder="Password" class="w-full border p-2 rounded">
                <button onclick="loginVendor()" class="w-full bg-green-600 text-white py-2 rounded font-bold">Login Karein</button>
            </div>

            <!-- Vendor Dashboard -->
            <div id="dashboardBox" class="hidden bg-white p-4 rounded-xl shadow space-y-3">
                <div class="flex justify-between items-center border-b pb-2">
                    <h3 class="font-bold">Apni Sabji Update Karein</h3>
                    <button onclick="logout()" class="text-red-500 text-sm">Logout</button>
                </div>
                
                <input type="text" id="vegName" placeholder="Sabji Ka Naam (e.g. Aloo)" class="w-full border p-2 rounded">
                <input type="number" id="vegRate" placeholder="Rate (₹ per Kg)" class="w-full border p-2 rounded">
                <input type="file" id="vegImage" accept="image/*" class="w-full text-sm">
                
                <button onclick="addOrUpdateProduct()" class="w-full bg-blue-600 text-white py-2 rounded font-bold">Sabji/Rate Save Karein</button>
            </div>

        </div>

    </div>

    <!-- Application Script -->
    <script>
        // REPLACE WITH YOUR FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const storage = firebase.storage();

        // App State
        let currentVendor = null;
        let cart = {};

        // Tab Switcher
        function switchTab(tab) {
            if(tab === 'customer') {
                document.getElementById('customerTab').classList.remove('hidden');
                document.getElementById('vendorTab').classList.add('hidden');
            } else {
                document.getElementById('customerTab').classList.add('hidden');
                document.getElementById('vendorTab').classList.remove('hidden');
            }
        }

        // Auth Monitor
        auth.onAuthStateChanged(user => {
            if(user) {
                currentVendor = user;
                document.getElementById('authBox').classList.add('hidden');
                document.getElementById('dashboardBox').classList.remove('hidden');
            } else {
                currentVendor = null;
                document.getElementById('authBox').classList.remove('hidden');
                document.getElementById('dashboardBox').classList.add('hidden');
            }
        });

        // Vendor Auth Logic
        function loginVendor() {
            const e = document.getElementById('loginEmail').value;
            const p = document.getElementById('loginPass').value;
            auth.signInWithEmailAndPassword(e, p).catch(err => alert(err.message));
        }

        function logout() { auth.signOut(); }

        // Product Upload Logic (By Vendor)
        async function addOrUpdateProduct() {
            const name = document.getElementById('vegName').value;
            const rate = document.getElementById('vegRate').value;
            const fileInput = document.getElementById('vegImage');
            
            if(!name || !rate) return alert("Sabhi details bharein");

            let imageUrl = "https://via.placeholder.com/150";

            if(fileInput.files[0]) {
                const file = fileInput.files[0];
                const storageRef = storage.ref(`vegetables/${Date.now()}_${file.name}`);
                await storageRef.put(file);
                imageUrl = await storageRef.getDownloadURL();
            }

            // Vendor Info Fetch
            const vendorDoc = await db.collection('vendors').doc(currentVendor.uid).get();
            const vendorData = vendorDoc.data() || { shopName: "Gao Mandi", phone: "910000000000" };

            await db.collection('products').add({
                vendorId: currentVendor.uid,
                vendorName: vendorData.shopName,
                vendorPhone: vendorData.phone,
                name: name,
                price: Number(rate),
                imageUrl: imageUrl,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            alert("Sabji Successfully Save Ho Gayi!");
            document.getElementById('vegName').value = '';
            document.getElementById('vegRate').value = '';
        }

        // Realtime Data Stream for Customers
        db.collection('products').onSnapshot(snapshot => {
            const container = document.getElementById('productList');
            container.innerHTML = '';

            snapshot.forEach(doc => {
                const item = doc.data();
                container.innerHTML += `
                    <div class="bg-white p-3 rounded-xl shadow flex items-center justify-between">
                        <img src="${item.imageUrl}" class="w-16 h-16 object-cover rounded-lg">
                        <div class="flex-1 ml-3">
                            <h4 class="font-bold text-base">${item.name}</h4>
                            <p class="text-xs text-gray-500">${item.vendorName || 'Dukan'}</p>
                            <p class="text-green-700 font-extrabold mt-1">₹${item.price} / kg</p>
                        </div>
                        <button onclick="sendWhatsAppOrder('${item.vendorPhone}', '${item.name}', ${item.price})" 
                                class="bg-green-500 text-white p-2 rounded-lg text-xs font-bold flex items-center gap-1">
                            📲 Order
                        </button>
                    </div>
                `;
            });
        });

        // Dynamic WhatsApp URL Engine
        function sendWhatsAppOrder(phone, vegName, price) {
            const qty = prompt(`${vegName} kitna kg chahiye? (e.g. 1 ya 2):`, "1");
            if(!qty) return;

            const total = Number(qty) * price;
            const message = `Namaste! Mujhe aapki dukan se order dena hai:%0A` +
                            `• *Sabji:* ${vegName}%0A` +
                            `• *Quantity:* ${qty} kg%0A` +
                            `• *Total Cost:* ₹${total}%0A%0A` +
                            `Kripya confirm karein.`;

            const waUrl = `https://wa.me/${phone}?text=${message}`;
                window.open(waUrl, '_blank');
        }
    </script>
</body>
</html>
