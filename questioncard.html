<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Islamic Quiz Generator Pro</title>
    <!-- Library for Image Download -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* CSS Styling */
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f0f4f0; padding: 10px; margin: 0; }
        .container { max-width: 500px; margin: auto; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 15px; }
        
        h3 { color: #1b5e20; margin-top: 0; }
        textarea { width: 100%; height: 120px; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        
        /* Toolbar */
        .toolbar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
        button { padding: 8px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; }
        .btn-phrase { background: #e0e0e0; color: #333; }
        .btn-arrow { background: #4caf50; color: white; }
        .btn-action { background: #1b5e20; color: white; }
        
        /* Preview Card */
        #captureArea { background: white; padding: 25px; border: 4px solid #1b5e20; width: 350px; margin: 20px auto; text-align: center; border-radius: 15px; }
        .p-title { font-weight: bold; font-size: 20px; margin-bottom: 5px; color: #1b5e20; }
        .p-subtitle { font-style: italic; font-weight: bold; font-size: 16px; margin-bottom: 15px; color: #444; }
        .p-question { font-size: 17px; margin-bottom: 20px; font-weight: 500; }
        .p-options { text-align: left; margin-left: 20px; }
        .p-footer { margin-top: 30px; font-size: 12px; color: #555; }
        
        input[type="text"] { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h3>📖 Islamic Quiz Builder Pro</h3>

    <!-- Control Section -->
    <div class="card">
        <label><b>Watermark Name:</b></label>
        <input type="text" id="watermarkInput" placeholder="Aapka Naam" oninput="updateCard()">
        
        <label style="margin-top: 10px; display: block;"><b>Hadees Text:</b></label>
        <textarea id="inputText" oninput="updateCard()" placeholder="Text yaha paste karein..."></textarea>
        
        <div class="toolbar">
            <button class="btn btn-phrase" onclick="insertPhrase('Kis Sahabi Ne Kaha: ')">Sahabi</button>
            <button class="btn btn-phrase" onclick="insertPhrase('Quran Me Kaha Hai: ')">Quran</button>
            <button class="btn btn-phrase" onclick="insertPhrase('Ek Hadees Hai Ki: ')">Hadees</button>
            <button class="btn btn-arrow" onclick="adjustSelection(-1)">⬅️ Select</button>
            <button class="btn btn-arrow" onclick="adjustSelection(1)">Select ➡️</button>
            <button class="btn btn-phrase" onclick="makeCaps()">ALL CAPS</button>
        </div>

        <label style="margin-top: 10px; display: block;"><b>Options:</b></label>
        <input type="text" id="optA" placeholder="A) Sahi Jawab Ka Intezar Hai" oninput="updateCard()">
        <input type="text" id="optB" placeholder="B) Sahi Jawab Ka Intezar Hai" oninput="updateCard()">
        <input type="text" id="optC" placeholder="C) Sahi Jawab Ka Intezar Hai" oninput="updateCard()">
        <input type="text" id="optD" placeholder="D) Sahi Jawab Ka Intezar Hai" oninput="updateCard()">
    </div>

    <!-- Preview Card -->
    <div id="captureArea">
        <div class="p-title" id="outTitle">*🌹 Islamic Quiz*</div>
        <div class="p-subtitle" id="outSub">_*Fill In Blank*_</div>
        <div class="p-question" id="outQuestion">Yaha sawal aayega...</div>
        <div class="p-options" id="outOptions">
            A) Sahi Jawab Ka Intezar Hai<br>
            B) Sahi Jawab Ka Intezar Hai<br>
            C) Sahi Jawab Ka Intezar Hai<br>
            D) Sahi Jawab Ka Intezar Hai
        </div>
        <div class="p-footer">
            <div id="outWatermark"></div>
            <div>[Jazakallah Khairan Kaseera]</div>
            <div id="outDate"></div>
        </div>
    </div>

    <!-- Action Buttons -->
    <div style="display: flex; gap: 10px; margin-bottom: 30px;">
        <button class="btn btn-action" style="flex:1" onclick="copyWhatsApp()">📋 Copy WhatsApp</button>
        <button class="btn btn-action" style="flex:1; background:#d32f2f" onclick="downloadImg()">🖼️ Download PNG</button>
    </div>
</div>

<script>
    // Logic for Selection Arrows
    function adjustSelection(dir) {
        let ta = document.getElementById('inputText');
        if (dir === -1 && ta.selectionStart > 0) ta.selectionStart--;
        if (dir === 1 && ta.selectionEnd < ta.value.length) ta.selectionEnd++;
        ta.focus();
    }

    // Insert Phrases
    function insertPhrase(text) {
        let ta = document.getElementById('inputText');
        ta.value = text + ta.value;
        updateCard();
    }

    // Capitalize
    function makeCaps() {
        let ta = document.getElementById('inputText');
        ta.value = ta.value.toUpperCase();
        updateCard();
    }

    // Main Update Function
    function updateCard() {
        // Update Title/Sub
        document.getElementById('outQuestion').innerText = document.getElementById('inputText').value;
        document.getElementById('outWatermark').innerText = document.getElementById('watermarkInput').value;
        document.getElementById('outDate').innerText = new Date().toLocaleDateString('en-GB');

        // Options Update
        let oA = document.getElementById('optA').value || "Sahi Jawab Ka Intezar Hai";
        let oB = document.getElementById('optB').value || "Sahi Jawab Ka Intezar Hai";
        let oC = document.getElementById('optC').value || "Sahi Jawab Ka Intezar Hai";
        let oD = document.getElementById('optD').value || "Sahi Jawab Ka Intezar Hai";
        
        document.getElementById('outOptions').innerHTML = 
            `A) ${oA}<br>B) ${oB}<br>C) ${oC}<br>D) ${oD}`;
    }

    // WhatsApp Copy (with * and _ for Formatting)
    function copyWhatsApp() {
        let title = "*🌹 Islamic Quiz*\n\n";
        let sub = "_*Fill In Blank*_\n\n";
        let q = document.getElementById('inputText').value + "\n\n";
        let oA = document.getElementById('optA').value || "Sahi Jawab Ka Intezar Hai";
        let oB = document.getElementById('optB').value || "Sahi Jawab Ka Intezar Hai";
        let oC = document.getElementById('optC').value || "Sahi Jawab Ka Intezar Hai";
        let oD = document.getElementById('optD').value || "Sahi Jawab Ka Intezar Hai";
        
        let opts = `A) ${oA}\nB) ${oB}\nC) ${oC}\nD) ${oD}\n\n`;
        let water = document.getElementById('watermarkInput').value + "\n";
        let footer = "[Jazakallah Khairan Kaseera]";
        
        navigator.clipboard.writeText(title + sub + q + opts + water + footer);
        alert("Text Copied with WhatsApp format!");
    }

    // Download Image
    function downloadImg() {
        html2canvas(document.getElementById('captureArea')).then(canvas => {
            let link = document.createElement('a');
            link.download = 'Islamic_Quiz.png';
            link.href = canvas.toDataURL();
            link.click();
        });
    }

    // Initialize Date
    updateCard();
</script>

</body>
</html>
