<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>Islamic Quiz Builder V3</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    /* Styling Updates */
    body { font-family: sans-serif; background: #e8f5e9; margin: 0; padding: 10px; }
    .card { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 10px; }
    
    /* Toolbar Layout */
    .controls { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
    .btn { padding: 6px 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; }
    .btn-phrase { background: #e0e0e0; color: #333; }
    .btn-arrow { background: #4caf50; color: white; }
    .btn-main { background: #1b5e20; color: white; }
    
    textarea { width: 100%; height: 100px; padding: 10px; border: 1px solid #ccc; }
    
    /* Preview Card (Whatsapp Ready) */
    #captureArea { background: white; padding: 20px; border: 3px solid #1b5e20; width: 350px; margin: auto; text-align: center; }
    .bold-title { font-weight: bold; font-size: 20px; margin-bottom: 5px; }
    .italic-subtitle { font-style: italic; font-weight: bold; margin-bottom: 15px; }
    .q-text { font-size: 16px; margin-bottom: 15px; text-align: center; }
    .q-options { text-align: left; display: flex; flex-direction: column; gap: 5px; }
    .watermark { margin-top: 20px; font-size: 12px; color: #777; }
  </style>
</head>
<body>

  <!-- Controls -->
  <div class="card">
    <label>1. Quick Phrases (Insert):</label>
    <div class="controls">
      <button class="btn btn-phrase" onclick="insertPhrase('Kis Sahabi Ne Kaha: ')">Sahabi Name</button>
      <button class="btn btn-phrase" onclick="insertPhrase('Quran Me Kaha Hai: ')">Quran Ayah</button>
      <button class="btn btn-phrase" onclick="insertPhrase('Ek Hadees Hai Ki: ')">Hadees Start</button>
    </div>

    <label>2. Selection Control (Select Text):</label>
    <div class="controls">
      <button class="btn btn-arrow" onclick="expandSelection(-1)">⬅️ Select Left</button>
      <button class="btn btn-arrow" onclick="expandSelection(1)">Select Right ➡️</button>
      <button class="btn btn-main" onclick="applyFormat('Answer The Question', 'Kya')">Kya</button>
      <button class="btn btn-main" onclick="applyFormat('Answer The Question', 'Kitne')">Kitne</button>
    </div>

    <textarea id="inputText" oninput="updateCard()" placeholder="Text yaha paste karein..."></textarea>
  </div>

  <!-- Preview -->
  <div id="captureArea">
    <div class="bold-title" id="pTitle">*🌹 Islamic Quiz*</div>
    <div class="italic-subtitle" id="pSubtitle">_*Fill In Blank*_</div>
    <div class="q-text" id="pQuestion">Yaha sawal aayega...</div>
    <div class="q-options" id="pOptions">
      A) Sahi Jawab Ka Intezar Hai<br>
      B) Sahi Jawab Ka Intezar Hai<br>
      C) Sahi Jawab Ka Intezar Hai<br>
      D) Sahi Jawab Ka Intezar Hai
    </div>
    <div class="watermark" id="pFooter">[Jazakallah Khairan Kaseera]<br><span id="pDate"></span></div>
  </div>

  <div style="text-align:center; margin-top:10px;">
    <button class="btn btn-main" onclick="copyWhatsApp()">📋 Copy for WhatsApp</button>
    <button class="btn btn-main" onclick="downloadImg()">🖼️ Download Image</button>
  </div>

<script>
  // Selection Logic
  function expandSelection(dir) {
    let ta = document.getElementById("inputText");
    if(dir === 1 && ta.selectionEnd < ta.value.length) ta.selectionEnd++;
    if(dir === -1 && ta.selectionStart > 0) ta.selectionStart--;
    ta.focus();
  }

  function insertPhrase(p) {
    let ta = document.getElementById("inputText");
    ta.value = p + ta.value;
    updateCard();
  }

  // Formatting Function
  function applyFormat(subtitle, qWord) {
    let ta = document.getElementById("inputText");
    let start = ta.selectionStart;
    let end = ta.selectionEnd;
    let selected = ta.value.substring(start, end);
    if(!selected) return alert("Pehle arrow se text select karein!");
    
    ta.value = ta.value.substring(0, start) + qWord + ta.value.substring(end);
    document.getElementById("pSubtitle").innerText = "_*" + subtitle + "*_";
    updateCard();
  }

  function updateCard() {
    let val = document.getElementById("inputText").value;
    document.getElementById("pQuestion").innerText = val;
    document.getElementById("pDate").innerText = new Date().toLocaleDateString();
  }

  // Copy with WhatsApp Formatting
  function copyWhatsApp() {
    let title = "*🌹 Islamic Quiz*\n\n";
    let sub = document.getElementById("pSubtitle").innerText + "\n\n";
    let q = document.getElementById("pQuestion").innerText + "\n\n";
    let opts = "A) Sahi Jawab Ka Intezar Hai\nB) Sahi Jawab Ka Intezar Hai\nC) Sahi Jawab Ka Intezar Hai\nD) Sahi Jawab Ka Intezar Hai\n\n";
    let footer = "[Jazakallah Khairan Kaseera]";
    
    navigator.clipboard.writeText(title + sub + q + opts + footer);
    alert("WhatsApp Format Copied!");
  }

  function downloadImg() {
    html2canvas(document.getElementById("captureArea")).then(canvas => {
      let link = document.createElement('a');
      link.download = 'quiz.png';
      link.href = canvas.toDataURL();
      link.click();
    });
  }
</script>
</body>
</html>
